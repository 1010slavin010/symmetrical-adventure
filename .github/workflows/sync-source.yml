name: Sync AgroSentry source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repository
        run: |
          rm -rf /tmp/source
          git clone --depth 1 https://github.com/ishankishor963-creator/i-am-sleepy-v1.git /tmp/source
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/source/ ./

      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync complete i-am-sleepy-v1 source"
            git push origin HEAD:main
          fi
